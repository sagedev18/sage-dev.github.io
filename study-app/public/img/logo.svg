<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="StudyFlow">
  <defs>
    <linearGradient id="sfGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="55%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="sfSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".35"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Rounded squircle plate -->
  <rect x="2" y="2" width="60" height="60" rx="18" fill="url(#sfGrad)"/>
  <rect x="2" y="2" width="60" height="60" rx="18" fill="url(#sfSheen)"/>

  <!-- Open book: two pages meeting at a soft centre fold -->
  <path d="M14 22c5.2-3.4 11-3.8 17.4-1.1a1 1 0 0 1 .6.93V45a1 1 0 0 1-1.3.96C25.4 43.6 19.8 43.2 14.9 46a1 1 0 0 1-1.4-.92V23a1 1 0 0 1 .5-.99Z"
        fill="#ffffff" fill-opacity=".97"/>
  <path d="M50 22c-5.2-3.4-11-3.8-17.4-1.1a1 1 0 0 0-.6.93V45a1 1 0 0 0 1.3.96c5.3-2.36 10.9-2.76 15.8.04a1 1 0 0 0 1.4-.92V23a1 1 0 0 0-.5-.99Z"
        fill="#ffffff" fill-opacity=".78"/>

  <!-- Centre fold -->
  <rect x="31.2" y="20.4" width="1.6" height="25.4" rx=".8" fill="#e9e7ff"/>

  <!-- Rising progress arc + dot: focus streak over the book -->
  <path d="M22.5 34.4c2.6-4.6 6-7.2 10.1-7.9" fill="none" stroke="#fde68a"
        stroke-width="3" stroke-linecap="round" opacity=".95"/>
  <circle cx="44.6" cy="23.1" r="3.4" fill="#fde68a"/>
</svg>
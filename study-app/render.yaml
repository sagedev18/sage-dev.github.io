services:
  - type: web
    name: studyflow
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: APP_URL
        fromService:
          type: web
          name: studyflow
          property: host
      - key: ADMIN_EMAILS
        value: admin@studyflow.app
      - key: EXPOSE_RESET_TOKEN
        value: "false"
    disk:
      name: data
      mountPath: /opt/render/project/src/data
      sizeGB: 1